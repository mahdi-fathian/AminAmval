services:
  aminamval:
    # بیلد محلی: docker compose build
    build:
      context: ..            # ریشهٔ ریپو (تا wwwroot واقعی کپی شود)
      dockerfile: deploy/Dockerfile
    image: aminamval:latest
    container_name: aminamval
    restart: unless-stopped      # همیشه بالا بماند، حتی بعد از ریبوت هاست
    ports:
      - "8080:8080"
    environment:
      ADMIN_PASSWORD: "به‌هنگام-اجرا-تغییر-دهید"      # ← قبل از اجرا عوض کنید
      CUSTODIAN_PASSWORD: "به‌هنگام-اجرا-تغییر-دهید"  # ← قبل از اجرا عوض کنید
      PREVIEW_MODE: "true"
      PORT: "8080"
      BACKUP_HOUR_UTC: "22"
      BACKUP_MINUTE_UTC: "30"
      BACKUP_RETENTION_DAYS: "14"
    volumes:
      - aminamval-data:/data    # دیتابیس/آپلود/کلید/پشتیبان — ماندگار
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:'+(process.env.PORT||8080)+'/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  aminamval-data:
